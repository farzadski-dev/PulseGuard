version: "3.9"

services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fraud
      DB_USERNAME: fraud
      DB_PASSWORD: fraud
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue:
    build: .
    command: php artisan queue:work --sleep=0 --tries=3 --timeout=10
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fraud
      MYSQL_USER: fraud
      MYSQL_PASSWORD: fraud
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=1G --innodb-log-file-size=256M
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql_data:
